name: Release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify plugin
        run: npm run check
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build release archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/term-interval-review
          cp main.js manifest.json styles.css release/term-interval-review/
          (cd release && zip -r "../term-interval-review-${VERSION}.zip" term-interval-review)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="term-interval-review-${VERSION}.zip"
          NOTES=$(cat <<'EOF'
          Исправлен автоматический переход после ответа на следующую доступную карточку.

          - режим выращивания больше не удерживает текущую карточку, если доступна следующая приоритетная;
          - проверены переходы для закреплённых, срочных и обычных карточек;
          - добавлена защита от двойной отправки ответа.
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css "$ZIP" --clobber
          else
            gh release create "$VERSION" main.js manifest.json styles.css "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "$NOTES"
          fi

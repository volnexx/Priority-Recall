name: Build check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Check syntax
        run: npm run check
      - name: Verify committed bundle is current
        run: git diff --exit-code -- main.js
      - name: Smoke-load bundle with Obsidian stub
        run: |
          node <<'NODE'
          const Module = require('module');
          const originalLoad = Module._load;
          Module._load = function(request, parent, isMain) {
            if (request === 'obsidian') {
              const Base = class {};
              return new Proxy({ ItemView: Base, PluginSettingTab: Base, Plugin: Base }, {
                get(target, key) {
                  if (key in target) return target[key];
                  return () => {};
                }
              });
            }
            return originalLoad.call(this, request, parent, isMain);
          };
          const plugin = require('./main.js');
          if (typeof plugin !== 'function') throw new Error('main.js does not export the plugin class');
          console.log('Bundle smoke test passed');
          NODE
